
name: Build CutMate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o CutMateAndroid-build-ready.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JSON compilation error
        run: |
          sed -i 's/ing.put(new JSONObject(o.toString()));/ing.put(o);/' project/CutMateAndroid/app/src/main/java/com/cutmate/app/MainActivity.java

      - name: Build APK
        run: |
          cd project/CutMateAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CutMate-apk
          path: project/CutMateAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
